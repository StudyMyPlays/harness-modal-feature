name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next typegen` first: tsc alone cannot see Next's generated route types.
      - run: npm run typecheck
      - run: npm test
      # Production dependencies only: the dev-only lint toolchain carries
      # advisories whose sole offered fix is a major downgrade.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
